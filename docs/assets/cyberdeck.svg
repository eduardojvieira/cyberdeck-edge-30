      <stop stop-color="#07121c"/>
      <stop offset="1" stop-color="#10252b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <path d="M670 0H1180Q1200 0 1200 20V380Q1200 400 1180 400H670Z" fill="url(#grid)" opacity=".65"/>
  <path d="M52 52H96M52 52V76M1148 348H1104M1148 348V324" fill="none" stroke="#6de6bd" stroke-width="2"/>
