<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Cyberdeck Edge 30 Ultra</title>
  <desc id="desc">Concept illustration of a landscape phone running a Linux terminal. Droidian, Plasma Mobile 6 and ARM64; experimental eqs port.</desc>
  <defs>
