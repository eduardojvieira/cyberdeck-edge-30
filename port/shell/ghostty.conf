# PC Tokyo Night terminal colors, with padding/font size for the Edge.
font-family = JetBrainsMono Nerd Font
font-size = 10
window-padding-x = 4
window-padding-y = 4
window-theme = dark
cursor-style = block
cursor-style-blink = false
resize-overlay = never
# Clean the per-terminal rendering overrides before starting the user's shell.
command = /usr/bin/env -u __EGL_VENDOR_LIBRARY_FILENAMES -u LIBGL_ALWAYS_SOFTWARE -u GDK_BACKEND -u GSK_RENDERER /usr/bin/fish
shell-integration = fish
async-backend = epoll
shell-integration-features = no-cursor,ssh-env
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
keybind = shift+enter=csi:13;2u
keybind = alt+shift+enter=csi:13;4u

background = #1a1b26
foreground = #a9b1d6
cursor-color = #c0caf5
selection-background = #292e42
selection-foreground = #c0caf5
palette = 0=#1a1b26
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#ad8ee6
palette = 6=#449dab
palette = 7=#a9b1d6
palette = 8=#414868
palette = 9=#ff7a93
palette = 10=#b9f27c
palette = 11=#ff9e64
palette = 12=#7da6ff
palette = 13=#bb9af7
palette = 14=#0db9d7
palette = 15=#c0caf5
