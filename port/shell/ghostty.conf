# PC Ryoku Paper Light colors, with padding/font size for the Edge.
font-family = JetBrainsMono Nerd Font
font-size = 9
window-padding-x = 4
window-padding-y = 4
window-theme = ghostty
cursor-style = block
cursor-style-blink = false
resize-overlay = never
# Clean the per-terminal rendering overrides before starting the user's shell.
command = /usr/bin/env -u __EGL_VENDOR_LIBRARY_FILENAMES -u LIBGL_ALWAYS_SOFTWARE -u GDK_BACKEND -u GSK_RENDERER /usr/bin/fish
shell-integration = fish
async-backend = auto
shell-integration-features = no-cursor,ssh-env
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard
keybind = shift+enter=csi:13;2u
keybind = alt+shift+enter=csi:13;4u

background = #f5f0e6
foreground = #211e1a
cursor-color = #6f4b17
cursor-text = #f5f0e6
selection-background = #ded3c0
selection-foreground = #211e1a
palette = 0=#211e1a
palette = 1=#9c2f24
palette = 2=#385331
palette = 3=#765014
palette = 4=#294d62
palette = 5=#71445c
palette = 6=#285952
palette = 7=#524a40
palette = 8=#655b4e
palette = 9=#a23b2b
palette = 10=#3f642d
palette = 11=#815915
palette = 12=#345f75
palette = 13=#84526d
palette = 14=#28685d
palette = 15=#171512
