# One bounded diagnostic boot only; replaces the launcher, not the compositor.
# Requires its already-generated wayfire.ini. No core dump or debuginfod network.
[Service]
Environment=KDE_NO_KWIN=1 KSCREEN_BACKEND=KSC_QScreen.so KSCREEN_BACKEND_INPROCESS=KSC_QScreen.so
ExecStart=
ExecStart=/usr/bin/dbus-run-session /usr/bin/gdb -q -batch -ex "set pagination off" -ex "set debuginfod enabled off" -ex run -ex "thread apply all bt" -ex "info registers" -ex "info proc mappings" -ex "info sharedlibrary" --args /usr/bin/wayfire -c /home/droidian/.config/plasma-mobile-wf/wayfire.ini
